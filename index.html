<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자 카드 정렬 게임</title>
<style>
  :root{
    --deep:#12507E; --sky:#2E90D9; --lsky:#DCEEFA; --pale:#F4F9FD;
    --cream:#FDF3E0; --orange:#EF8A2B; --ink:#2B3A45; --gray:#5A6B78;
    --green:#3E9C6B; --red:#D8544E; --line:#D9E6EF;
    --shadow:0 2px 10px rgba(24,70,100,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
                system-ui,-apple-system,sans-serif;
    background:var(--pale); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 60px}

  header{display:flex;align-items:flex-end;justify-content:space-between;
         gap:16px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:26px;font-weight:800;color:var(--deep);margin:0 0 4px}
  .sub{font-size:14px;color:var(--gray);margin:0}
  .theory{background:#fff;border:1px solid var(--line);border-radius:12px;
          padding:10px 16px;font-size:13px;color:var(--gray);box-shadow:var(--shadow)}
  .theory b{color:var(--deep);font-size:17px;font-variant-numeric:tabular-nums}

  .bar{background:#fff;border:1px solid var(--line);border-radius:14px;
       padding:14px 18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;
       box-shadow:var(--shadow);margin-bottom:16px}
  .field{display:flex;align-items:center;gap:10px}
  .field>label{font-size:13px;color:var(--gray);white-space:nowrap}
  .modes{display:flex;background:var(--pale);border-radius:10px;padding:3px;gap:3px}
  .modes button{border:0;background:transparent;font:inherit;font-size:13.5px;
                padding:7px 13px;border-radius:8px;cursor:pointer;color:var(--gray)}
  .modes button[aria-pressed="true"]{background:var(--deep);color:#fff;font-weight:700}
  input[type=range]{width:140px;accent-color:var(--sky)}
  #nOut{font-weight:800;color:var(--deep);font-variant-numeric:tabular-nums;
        min-width:2.2em;text-align:right}
  .btn{border:0;font:inherit;font-size:14px;font-weight:700;padding:9px 16px;
       border-radius:10px;cursor:pointer;background:var(--lsky);color:var(--deep)}
  .btn:hover:not(:disabled){filter:brightness(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--orange);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--gray)}
  .btn.go{background:#fff;color:var(--deep)}
  .btn:focus-visible,.modes button:focus-visible,.card:focus-visible{
    outline:3px solid var(--orange);outline-offset:2px}
  .spacer{flex:1}

  .score{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--gray)}
  .stat .v{font-size:30px;font-weight:800;color:var(--deep);
           font-variant-numeric:tabular-nums;line-height:1.2}
  .stat.hot .v{color:var(--orange)}

  .table{background:var(--deep);border-radius:18px;padding:26px 22px;
         min-height:240px;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:18px}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-bottom:22px}
  .card{
    position:relative;border:0;padding:0;cursor:pointer;font:inherit;
    width:var(--cw,74px);height:calc(var(--cw,74px) * 1.42);
    border-radius:12px;background:#fff;color:var(--deep);
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--cw,74px) * .38);font-weight:800;
    font-variant-numeric:tabular-nums;
    box-shadow:0 3px 0 rgba(0,0,0,.16);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .card .back{color:var(--sky);opacity:.55;font-size:calc(var(--cw,74px)*.42)}
  .card:hover:not(:disabled){transform:translateY(-6px)}
  .card.sel{background:var(--cream);box-shadow:0 0 0 3px var(--orange),0 3px 0 rgba(0,0,0,.16);
            transform:translateY(-10px)}
  .card.win{background:#E7F5EE;color:var(--green);box-shadow:0 0 0 3px var(--green)}
  .card.lose{background:#FBEDEA;color:var(--red);box-shadow:0 0 0 3px var(--red)}
  .card.locked{background:var(--lsky);color:var(--deep);cursor:default}
  .card.fixed{background:#E7F5EE;color:var(--green);cursor:default;
              box-shadow:0 3px 0 rgba(0,0,0,.10)}
  .card.cand{box-shadow:0 0 0 3px var(--orange),0 3px 0 rgba(0,0,0,.16)}
  .card.target{box-shadow:0 0 0 3px #FFD08A,0 3px 0 rgba(0,0,0,.16)}
  .card:disabled{cursor:not-allowed}
  .card .pos{position:absolute;bottom:-19px;left:0;right:0;text-align:center;
             font-size:11px;font-weight:600;color:#8FBEDE}
  .card .tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
             background:var(--orange);color:#fff;font-size:10px;font-weight:700;
             padding:2px 7px;border-radius:9px;white-space:nowrap}
  .card .tag.t2{background:#FFD08A;color:#7A4A05}

  .prompt{min-height:62px;display:flex;align-items:center;justify-content:center;
          gap:12px;flex-wrap:wrap;text-align:center}
  .prompt p{margin:0;font-size:16.5px;color:#CFE6F7;width:100%}
  .prompt strong{color:#fff}
  .prompt .big{font-size:20px;font-weight:800;color:#FFD08A}

  .result{margin-top:18px;background:#fff;border:1px solid var(--line);
          border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);display:none}
  .result.show{display:block}
  .result h2{margin:0 0 6px;font-size:20px;color:var(--deep)}
  .result .lead{margin:0 0 16px;color:var(--gray);font-size:14px}
  .meter{height:14px;border-radius:7px;background:var(--pale);overflow:hidden;
         border:1px solid var(--line)}
  .meter i{display:block;height:100%;background:var(--sky)}
  .meterlabels{display:flex;justify-content:space-between;font-size:12px;
               color:var(--gray);margin-top:6px}

  .log{margin-top:22px}
  .log h3{font-size:15px;color:var(--deep);margin:0 0 10px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;
        overflow:hidden;box-shadow:var(--shadow);font-size:14px}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
  th{background:var(--deep);color:#fff;font-weight:700;font-size:13px}
  tr:last-child td{border-bottom:0}
  td.mode{font-weight:700;color:var(--deep)}
  .empty{color:var(--gray);font-size:13px;background:#fff;border:1px dashed var(--line);
         border-radius:12px;padding:22px;text-align:center}

  .rule{margin-top:22px;background:var(--cream);border-radius:14px;padding:16px 20px;
        font-size:14px;color:#8a5a15;line-height:1.75}
  .rule b{color:var(--orange)}
  .rule .h{display:block;font-weight:800;color:#7A4A05;margin-top:10px}
  .rule .h:first-child{margin-top:0}

  @media (max-width:640px){
    .score{grid-template-columns:repeat(2,1fr)}
    h1{font-size:21px}
    .modes{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>숫자 카드 정렬 게임</h1>
      <p class="sub">카드는 뒤집혀 있습니다. 두 장을 골라 비교해야만 어느 쪽이 큰지 알 수 있어요.</p>
    </div>
    <div class="theory">최악의 경우 비교 횟수 &nbsp;n(n−1)÷2 = <b id="theory">15</b>회</div>
  </header>

  <div class="bar">
    <div class="field">
      <label>규칙</label>
      <div class="modes" id="m">
        <button type="button" data-mode="bubble" aria-pressed="true">버블 정렬</button>
        <button type="button" data-mode="selection" aria-pressed="false">선택 정렬</button>
        <button type="button" data-mode="free" aria-pressed="false">자유 연습</button>
      </div>
    </div>
    <div class="field">
      <label for="n">카드 수</label>
      <input type="range" id="n" min="6" max="30" value="6" step="1">
      <span id="nOut">6</span>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="peek" type="button">잠깐 전체 보기</button>
    <button class="btn primary" id="check" type="button">정렬 완료 확인</button>
    <button class="btn" id="reset" type="button">새로 섞기</button>
  </div>

  <div class="score">
    <div class="stat hot"><div class="k">비교 횟수</div><div class="v" id="sComp">0</div></div>
    <div class="stat"><div class="k">자리 바꾼 횟수</div><div class="v" id="sSwap">0</div></div>
    <div class="stat"><div class="k">완료 확인 시도</div><div class="v" id="sCheck">0</div></div>
    <div class="stat"><div class="k">카드 수</div><div class="v" id="sN">6</div></div>
  </div>

  <div class="table">
    <div class="row" id="row"></div>
    <div class="prompt" id="prompt"></div>
  </div>

  <div class="result" id="result" aria-live="polite"></div>

  <div class="log">
    <h3>우리 모둠 기록</h3>
    <div id="logBox"><div class="empty">정렬을 완성하면 기록이 여기에 쌓입니다.</div></div>
  </div>

  <div class="rule" id="ruleText"></div>

</div>

<script>
(function(){
  "use strict";

  var VALUES = [], N = 6, MODE = "bubble";
  var sel = [], revealed = null, revealKind = "", comp = 0, swap = 0, checks = 0;
  var done = false, peeking = false, roundNo = 0, log = [];
  var p = 0, cand = 0;                    // 선택 정렬 전용 상태

  var $ = function(id){ return document.getElementById(id); };
  var rowEl = $("row"), promptEl = $("prompt"), resultEl = $("result");

  var RULES = {
    bubble:
      "<span class='h'>버블 정렬 규칙</span>" +
      "<b>바로 옆에 있는 두 장</b>만 비교할 수 있습니다. 비교한 뒤 큰 수가 뒤로 가도록 " +
      "자리를 바꿀지 결정하세요. 큰 수가 물거품처럼 뒤로 밀려 올라갑니다." +
      "<span class='h'>목표</span>비교 횟수를 최대한 적게 쓰고 오름차순으로 정렬하기.",
    selection:
      "<span class='h'>선택 정렬 규칙</span>" +
      "아직 정하지 않은 카드 중에서 <b>가장 작은 카드 한 장</b>을 찾아 맨 앞에 놓는 방식입니다. " +
      "★ 표시가 붙은 카드가 지금까지 찾은 <b>최솟값 후보</b>이고, 다른 카드를 누르면 후보와 비교합니다. " +
      "더 작은 카드를 만나면 후보를 바꾸세요. 다 찾았다고 판단되면 " +
      "<b>이 자리에 확정</b>을 눌러 앞자리에 놓습니다." +
      "<span class='h'>목표</span>확정한 자리는 초록색으로 잠깁니다. 끝까지 채우면 정렬 완료.",
    free:
      "<span class='h'>자유 연습 규칙</span>" +
      "아무 카드나 두 장 골라 비교하고 자유롭게 자리를 바꿀 수 있습니다. " +
      "나만의 방법으로 <b>가장 적은 비교 횟수</b>에 도전해 보세요." +
      "<span class='h'>목표</span>버블·선택 정렬보다 적은 횟수로 끝낼 수 있는지 실험하기."
  };

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function makeValues(n){
    var pool=[]; for(var v=10; v<=99; v++) pool.push(v);
    shuffle(pool); return pool.slice(0,n);
  }
  function isSorted(a){
    for(var i=1;i<a.length;i++) if(a[i-1]>a[i]) return false;
    return true;
  }
  function theoryMax(n){ return n*(n-1)/2; }
  function modeName(m){
    return m==="bubble" ? "버블 정렬" : m==="selection" ? "선택 정렬" : "자유 연습";
  }

  function newRound(){
    N = parseInt($("n").value,10);
    VALUES = makeValues(N);
    if(isSorted(VALUES)) shuffle(VALUES);
    sel=[]; revealed=null; revealKind=""; comp=0; swap=0; checks=0;
    done=false; peeking=false; p=0; cand=0;
    resultEl.className="result"; resultEl.innerHTML="";
    $("ruleText").innerHTML = RULES[MODE];
    render(); idlePrompt();
  }

  function say(html, extra){
    promptEl.innerHTML = "<p>" + html + "</p>" + (extra||"");
  }

  function idlePrompt(){
    if(done){ say("정렬 완료!"); return; }
    if(MODE === "selection"){
      if(p >= N-1){
        say("마지막 한 장은 자동으로 제자리입니다. <strong>정렬 완료 확인</strong>을 눌러 보세요.");
        return;
      }
      var btn = "<button class='btn go' id='fix' type='button'>★ 후보를 " +
                (p+1) + "번 자리에 확정</button>";
      say("<strong>" + (p+1) + "번 자리</strong>에 놓을 가장 작은 카드를 찾는 중입니다. " +
          "후보와 비교할 카드를 누르세요.", btn);
      $("fix").addEventListener("click", fixCandidate);
    } else if(MODE === "bubble"){
      say("이웃한 카드 두 장을 골라 비교해 보세요.");
    } else {
      say("카드 두 장을 골라 비교해 보세요.");
    }
  }

  function cardWidth(n){
    if(n<=8) return 76; if(n<=12) return 64; if(n<=18) return 54;
    if(n<=24) return 46; return 40;
  }

  function render(){
    $("sComp").textContent=comp; $("sSwap").textContent=swap;
    $("sCheck").textContent=checks; $("sN").textContent=N;
    $("nOut").textContent=$("n").value; $("theory").textContent=theoryMax(N);

    rowEl.style.setProperty("--cw", cardWidth(N)+"px");
    rowEl.innerHTML="";

    for(var i=0;i<VALUES.length;i++){
      var fixedHere = (MODE==="selection" && i < p);
      var inPair = revealed && (i===revealed[0] || i===revealed[1]);
      var open = peeking || done || inPair || fixedHere;

      var b = document.createElement("button");
      b.type="button"; b.className="card"; b.dataset.i=i;

      if(open){
        b.textContent = VALUES[i];
        if(inPair && !done && !peeking){
          var a=VALUES[revealed[0]], c=VALUES[revealed[1]];
          if(i===revealed[0]) b.classList.add(a>c?"lose":"win");
          if(i===revealed[1]) b.classList.add(c>a?"lose":"win");
        }
        if(fixedHere) b.classList.add("fixed");
        else if(done || peeking) b.classList.add("locked");
      } else {
        var sp=document.createElement("span");
        sp.className="back"; sp.textContent="?";
        b.appendChild(sp);
        b.setAttribute("aria-label",(i+1)+"번 자리 카드, 뒷면");
      }

      if(MODE==="selection" && !done){
        if(i===cand && i>=p){
          if(!inPair) b.classList.add("cand");
          var tg=document.createElement("span");
          tg.className="tag"; tg.textContent="★ 후보";
          b.appendChild(tg);
        } else if(i===p && cand!==p){
          if(!inPair) b.classList.add("target");
          var tg2=document.createElement("span");
          tg2.className="tag t2"; tg2.textContent="놓을 자리";
          b.appendChild(tg2);
        }
      }

      if(sel.indexOf(i)!==-1) b.classList.add("sel");
      if(done || peeking || revealed || fixedHere) b.disabled=true;
      if(MODE==="selection" && i===cand) b.disabled=true;

      var pos=document.createElement("span");
      pos.className="pos"; pos.textContent=i+1;
      b.appendChild(pos);
      rowEl.appendChild(b);
    }
  }

  // ---------- 비교 결과 표시 ----------
  function showCompare(iL, iR, buttons){
    revealed=[iL,iR]; comp++; render();
    var L=VALUES[iL], R=VALUES[iR];
    var msg = L>R
      ? "<span class='big'>"+L+" &gt; "+R+"</span> &nbsp; "+(iL+1)+"번이 더 큽니다."
      : "<span class='big'>"+L+" &lt; "+R+"</span> &nbsp; "+(iR+1)+"번이 더 큽니다.";
    promptEl.innerHTML = "<p>"+msg+"</p>"+buttons;
  }

  // ---------- 버블 / 자유 ----------
  function pickPair(i){
    var at=sel.indexOf(i);
    if(at!==-1){ sel.splice(at,1); render(); idlePrompt(); return; }
    if(sel.length===1 && MODE==="bubble" && Math.abs(sel[0]-i)!==1){
      render();
      say("버블 정렬은 이웃끼리만 비교합니다. <strong>바로 옆 카드</strong>를 골라 주세요.");
      return;
    }
    sel.push(i);
    if(sel.length<2){ render(); say("한 장 더 고르세요."); return; }

    sel.sort(function(a,b){return a-b;});
    var iL=sel[0], iR=sel[1]; sel=[];
    revealKind="pair";
    showCompare(iL, iR,
      "<button class='btn primary' id='doSwap' type='button'>자리 바꾸기</button>" +
      "<button class='btn ghost' id='doKeep' type='button'>그대로 두기</button>");
    $("doSwap").addEventListener("click",function(){ resolvePair(true); });
    $("doKeep").addEventListener("click",function(){ resolvePair(false); });
    $("doSwap").focus();
  }

  function resolvePair(doSwap){
    if(doSwap){
      var i=revealed[0], j=revealed[1];
      var t=VALUES[i]; VALUES[i]=VALUES[j]; VALUES[j]=t; swap++;
    }
    revealed=null; render();
    say(doSwap ? "자리를 바꿨습니다. 다음 두 장을 골라 보세요."
               : "그대로 두었습니다. 다음 두 장을 골라 보세요.");
  }

  // ---------- 선택 정렬 ----------
  function pickSelection(i){
    if(i < p || i === cand) return;
    revealKind="sel";
    var iL = Math.min(cand,i), iR = Math.max(cand,i);
    showCompare(iL, iR,
      "<button class='btn primary' id='newCand' type='button'>" +
      (i+1) + "번을 새 후보로</button>" +
      "<button class='btn ghost' id='keepCand' type='button'>후보 그대로</button>");
    var clicked = i;
    $("newCand").addEventListener("click",function(){
      cand = clicked; revealed=null; render();
      say("★ 후보가 <strong>"+(clicked+1)+"번</strong>으로 바뀌었습니다.",
          "<button class='btn go' id='fix' type='button'>★ 후보를 "+(p+1)+"번 자리에 확정</button>");
      $("fix").addEventListener("click", fixCandidate);
    });
    $("keepCand").addEventListener("click",function(){
      revealed=null; render(); idlePrompt();
    });
    $("newCand").focus();
  }

  function fixCandidate(){
    if(cand !== p){
      var t=VALUES[p]; VALUES[p]=VALUES[cand]; VALUES[cand]=t; swap++;
    }
    p++; cand = p; revealed=null; render();
    if(p >= N-1){
      idlePrompt();
    } else {
      say("<strong>"+p+"번 자리</strong>가 확정되었습니다. 다음 자리를 채워 보세요.",
          "<button class='btn go' id='fix' type='button'>★ 후보를 "+(p+1)+"번 자리에 확정</button>");
      $("fix").addEventListener("click", fixCandidate);
    }
  }

  // ---------- 완료 확인 ----------
  function check(){
    if(done || revealed) return;
    checks++;
    if(!isSorted(VALUES)){
      render();
      say("아직 순서가 맞지 않아요. 조금 더 비교해 보세요.");
      return;
    }
    done=true; roundNo++; render(); say("정렬 완료!");
    showResult();
  }

  function showResult(){
    var max=theoryMax(N);
    var pct=Math.min(100, Math.round(comp/max*100));
    var verdict;
    if(comp <= N-1)          verdict="최소 비교 횟수에 가깝습니다. 아주 효율적이에요.";
    else if(comp <= max*0.5) verdict="이론상 최악의 절반 이하로 끝냈습니다.";
    else if(comp <= max)     verdict="이론상 최악의 경우 안에서 끝냈습니다.";
    else                     verdict="최악의 경우보다 많이 비교했어요. 다시 도전해 보세요.";

    resultEl.className="result show";
    resultEl.innerHTML =
      "<h2>"+modeName(MODE)+" 완료 — 비교 "+comp+"회, 자리 바꾸기 "+swap+"회</h2>"+
      "<p class='lead'>"+verdict+"</p>"+
      "<div class='meter'><i style='width:"+pct+"%'></i></div>"+
      "<div class='meterlabels'><span>0회</span><span>내 비교 "+comp+
      "회</span><span>최악 "+max+"회</span></div>";

    log.unshift({no:roundNo, mode:modeName(MODE), n:N,
                 comp:comp, swap:swap, checks:checks, max:max});
    renderLog();
  }

  function renderLog(){
    var box=$("logBox");
    if(!log.length){
      box.innerHTML="<div class='empty'>정렬을 완성하면 기록이 여기에 쌓입니다.</div>";
      return;
    }
    var h="<table><thead><tr><th>회차</th><th>규칙</th><th>카드 수</th>"+
          "<th>비교</th><th>자리 바꾸기</th><th>확인 시도</th><th>최악 대비</th>"+
          "</tr></thead><tbody>";
    for(var i=0;i<log.length;i++){
      var r=log[i];
      h+="<tr><td>"+r.no+"</td><td class='mode'>"+r.mode+"</td><td>"+r.n+
         "</td><td><b>"+r.comp+"</b></td><td>"+r.swap+"</td><td>"+r.checks+
         "</td><td>"+Math.round(r.comp/r.max*100)+"%</td></tr>";
    }
    box.innerHTML=h+"</tbody></table>";
  }

  // ---------- events ----------
  rowEl.addEventListener("click", function(e){
    var b=e.target.closest(".card");
    if(!b || b.disabled) return;
    if(done || revealed || peeking) return;
    var i=parseInt(b.dataset.i,10);
    if(MODE==="selection") pickSelection(i); else pickPair(i);
  });

  $("m").addEventListener("click", function(e){
    var b=e.target.closest("button[data-mode]");
    if(!b) return;
    MODE=b.dataset.mode;
    var all=this.querySelectorAll("button");
    for(var i=0;i<all.length;i++)
      all[i].setAttribute("aria-pressed", all[i]===b ? "true":"false");
    newRound();
  });

  $("n").addEventListener("input", function(){
    $("nOut").textContent=this.value;
    $("theory").textContent=theoryMax(parseInt(this.value,10));
  });
  $("n").addEventListener("change", newRound);
  $("reset").addEventListener("click", newRound);
  $("check").addEventListener("click", check);

  $("peek").addEventListener("click", function(){
    if(done || revealed) return;
    peeking=true; render();
    say("전체 공개 중입니다. 곧 다시 뒤집힙니다.");
    var self=this; self.disabled=true;
    setTimeout(function(){
      peeking=false; self.disabled=false; render(); idlePrompt();
    },1600);
  });

  newRound();
})();
</script>
</body>
</html>
